name: 'Fetch package versions'

on:
  schedule:
    # Runs every three hours at 01:00, 04:00, 07:00, 10:00, 13:00, 16:00, 19:00, and 22:00 UTC daily.
    - cron: '0 1,4,7,10,13,16,19,22 * * *'

  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  fetch-package-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GITHUB_TOKEN: "${{ secrets.TOKEN }}"

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository }}"
          token: "${{ env.GITHUB_TOKEN }}"

      - name: 'Fetch latest version of JOPDF'
        shell: bash
        run: |
          set -x

          OUTPUT_FILE='./jopdf-latest-version.txt'

          curl \
            -fsSL https://cdn.jopdf.com/download/jopdf/jopdf-linux-amd64_setup.deb \
            -o ./jopdf-linux-amd64_setup.deb

          LATEST_VERSION=$(dpkg -I ./jopdf-linux-amd64_setup.deb | sed -n 's| Version: ||p')

          if [ -f "$OUTPUT_FILE" ]; then
            CURRENT_VERSION="$(cat "$OUTPUT_FILE")"
            if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
              echo "$LATEST_VERSION" | tee "$OUTPUT_FILE" > /dev/null
            else
              echo 'Both versions are the same, no changes needed.'
            fi
          fi

          rm ./jopdf-linux-amd64_setup.deb

      - name: 'Commit changes'
        shell: bash
        run: |
          set -x

          USERNAME='github-actions[bot]'
          EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          git config --local user.name "$USERNAME"
          git config --local user.email "$EMAIL"
          git add -A
          # Get the list of staged files
          STAGED_FILES="$(git diff --cached --name-only)"

          if [ -n "$STAGED_FILES" ]; then
            commit_message=''

            CURRENT_TIME="$(date +'%Y-%m-%d %H:%M:%S')"
            commit_message="bot: Fetched new package versions at $CURRENT_TIME UTC [skip ci]"

            git commit -m "$commit_message"
          fi

      - name: 'Push changes'
        uses: ad-m/github-push-action@v1.1.0
        with:
          github_token: "${{ env.GITHUB_TOKEN }}"
          branch: "${{ github.ref }}"
